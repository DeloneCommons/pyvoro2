name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-sync:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Lint
        run: flake8 src tests tools benchmarks examples
      - name: Check notebook exports
        run: python tools/export_notebooks.py --check
      - name: Check README sync
        run: python tools/gen_readme.py --check

  docs-and-notebooks:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install full optional stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[all]
      - name: Require the installed qualified planar profile
        run: python tools/check_installed_package.py --require-scipy
      - name: Validate notebooks
        run: python tools/check_notebooks.py
      - name: Test developer tooling
        run: pytest -q tests/tooling
      - name: Check generated files
        run: |
          python tools/export_notebooks.py --check
          python tools/gen_readme.py --check
      - name: Build docs
        run: mkdocs build --strict

  native-sanitizers:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install sanitizer build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U cmake ninja
      - name: Build and install with ASan and UBSan
        env:
          CXXFLAGS: >-
            -fsanitize=address,undefined,float-cast-overflow
            -fno-omit-frame-pointer -O1 -g
          LDFLAGS: -fsanitize=address,undefined,float-cast-overflow
        run: python -m pip install -v .[test]
      - name: Run native safety regressions under ASan and UBSan
        shell: bash
        run: |
          ASAN_LIB="$(g++-13 -print-file-name=libasan.so)"
          UBSAN_LIB="$(g++-13 -print-file-name=libubsan.so)"
          STDCXX_LIB="$(g++-13 -print-file-name=libstdc++.so)"
          test -f "$ASAN_LIB"
          test -f "$UBSAN_LIB"
          test -f "$STDCXX_LIB"
          env \
            LD_PRELOAD="${ASAN_LIB}:${UBSAN_LIB}:${STDCXX_LIB}" \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            PYVORO2_NATIVE_TEST_SANITIZERS=1 \
            python -m pytest -q -s \
              tests/forward/common/test_native_boundary_validation.py \
              tests/forward/common/test_native_preconditions.py \
              tests/forward/common/test_generator_preparation.py \
              tests/forward/spatial/test_duplicate_check.py \
              tests/forward/spatial/test_ghost_cells.py \
              tests/forward/spatial/test_native_witness.py \
              tests/tooling/test_native_witness_cpp.py \
              tests/forward/planar/test_api_dispatch.py \
              tests/forward/planar/test_wp6_native.py \
              tests/forward/planar/test_wp6_profile_refusal.py

  # This is the mandatory full suite. A changed compiler/target profile fails
  # the installed gate and requires qualification; it never turns into a skip.
  test-linux-qualified:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install -U pip cmake ninja pybind11
      - name: Install package and record effective native commands
        run: |
          g++-13 --version
          python -m pip install -v .[test]
      - name: Check installed source/profile and SciPy-enabled workflows
        shell: bash
        run: |
          python tools/check_installed_package.py --require-scipy \
            | tee installed-package-profile.txt
      - name: Record 3D native FP qualification
        run: >-
          python -m pytest -q -s tests/forward/spatial/test_native_witness.py
          tests/tooling/test_native_witness_cpp.py
          -k "surviving_seed_legacy_zero or uncontracted or offset_operation_order"
      - name: Compare optimized planar witness with qualified stock producer
        shell: bash
        run: |
          cmake -S . -B build/wp6-qualification -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPYVORO2_PLANAR_QUALIFICATION=ON \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build/wp6-qualification --target _core2d --parallel 2
          PLANAR_INSTALLED="$(python -c 'import importlib.util; print(importlib.util.find_spec("pyvoro2._core2d").origin)')"
          PLANAR_QUALIFIED="$(python -c 'from pathlib import Path; print(next(Path("build/wp6-qualification/pyvoro2").glob("_core2d*.so")))')"
          python tools/native/check_planar_witness.py \
            --module "$PLANAR_INSTALLED" \
            --qualification-module "$PLANAR_QUALIFIED" \
            --source-manifest build/wp6-qualification/planar-source-closure.txt \
            --output wp6-qualification.json
      - name: Run full installed-package suite including seeded fuzz
        run: python -m pytest -q
      - name: Preserve compiled planar profile and qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp6-linux-py${{ matrix.python-version }}
          path: |
            installed-package-profile.txt
            wp6-qualification.json
            build/wp6-qualification/planar-source-closure.txt
            build/wp6-qualification/planar-build-profile.txt
            build/wp6-qualification/compile_commands.json

  # These builds retain 3D and pure-Python coverage. Ordinary planar provenance
  # is explicitly unsupported; every mask/input mode must refuse structurally.
  test-other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve reviewed source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install -U pip cmake ninja
      - name: Build and install package
        run: python -m pip install -v .[test]
      - name: Check installed 3D/algebra workflows and explicit planar refusal
        shell: bash
        run: |
          python tools/check_installed_package.py --require-scipy --planar-refusal \
            | tee installed-package-profile.txt
      - name: Run spatial, pure-Python, tooling and planar refusal tests
        run: >-
          python -m pytest -q
          tests/forward/spatial
          tests/forward/planar/test_wp6_ideal.py
          tests/forward/planar/test_wp6_consumers.py
          tests/forward/planar/test_wp6_profile_refusal.py
          tests/forward/common/test_internal_validation.py
          tests/forward/common/test_exact_lattice_reduction.py
          tests/forward/common/test_periodic_images.py
          tests/forward/common/test_native_translation.py
          tests/inverse/separator/test_constraints.py
          tests/inverse/separator/test_fit.py
          tests/inverse/separator/test_objective_contract.py
          tests/inverse/separator/test_numerics.py
          tests/tooling
      - name: Preserve installed source/profile and refusal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp6-refusal-${{ matrix.os }}-py${{ matrix.python-version }}
          path: installed-package-profile.txt

  build-dist:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja build twine
      - name: Build sdist
        run: python -m build --sdist
      - name: Build wheel from sdist in build isolation
        run: python tools/build_wheel_from_sdist.py dist
      - name: Validate metadata
        run: python tools/check_dist_metadata.py dist
      - name: Check packaged files
        run: python tools/check_dist.py dist
      - name: Create fresh no-SciPy environment
        run: python -m venv "${{ runner.temp }}/pyvoro2-sdist-venv"
      - name: Install wheel rebuilt from sdist
        run: |
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" \
            -m pip install dist/*.whl
      - name: Check no-SciPy installation and qualified planar profile
        run: |
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" -m pip check
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" \
            tools/check_installed_package.py --forbid-scipy
