name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

  workflow_dispatch:
    inputs:
      extended:
        description: Run the full platform and Python matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: '3.13'
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Lint
        run: flake8 src tests tools benchmarks examples
      - name: Check notebook exports
        run: python tools/export_notebooks.py --check
      - name: Check README sync
        run: python tools/gen_readme.py --check

  native-sanitizers:
    needs: lint-sync
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: '3.13'
      - name: Install sanitizer build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U cmake ninja
      - name: Build and install with ASan and UBSan
        env:
          CXXFLAGS: >-
            -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g
          LDFLAGS: -fsanitize=address,undefined
        run: python -m pip install .[test]
      - name: Run native safety regressions under ASan and UBSan
        shell: bash
        run: |
          ASAN_LIB="$(g++ -print-file-name=libasan.so)"
          UBSAN_LIB="$(g++ -print-file-name=libubsan.so)"
          test -f "$ASAN_LIB"
          test -f "$UBSAN_LIB"
          env \
            LD_PRELOAD="${ASAN_LIB}:${UBSAN_LIB}" \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            python -m pytest -q \
              tests/forward/common/test_native_boundary_validation.py \
              tests/forward/common/test_native_preconditions.py \
              tests/forward/common/test_generator_preparation.py \
              tests/forward/spatial/test_duplicate_check.py \
              tests/forward/spatial/test_ghost_cells.py \
              tests/forward/planar/test_api_dispatch.py

  test:
    needs: lint-sync
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.extended && '{"os":["ubuntu-latest","macos-15","windows-latest"],"python-version":["3.10","3.11","3.12","3.13","3.14"]}' || '{"os":["ubuntu-latest"],"python-version":["3.10","3.14"]}') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install build tools
        run: python -m pip install -U cmake ninja
      - name: Install package
        run: python -m pip install ".[${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && 'all' || 'test' }}]"
      - name: Check SciPy-enabled installed workflows
        run: python tools/check_installed_package.py --require-scipy
      - name: Run installed-package tests
        run: python -m pytest -q
      - name: Validate notebooks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python tools/check_notebooks.py
      - name: Build docs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: mkdocs build --strict

  build-dist:
    needs: lint-sync
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja build twine
      - name: Build sdist
        run: python -m build --sdist
      - name: Build wheel from sdist in build isolation
        run: python tools/build_wheel_from_sdist.py dist
      - name: Validate metadata
        run: python tools/check_dist_metadata.py dist
      - name: Check packaged files
        run: python tools/check_dist.py dist
      - name: Create fresh no-SciPy environment
        run: python -m venv "${{ runner.temp }}/pyvoro2-sdist-venv"
      - name: Install wheel rebuilt from sdist
        run: |
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" \
            -m pip install dist/*.whl
      - name: Check no-SciPy installation
        run: |
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" -m pip check
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" \
            tools/check_installed_package.py --forbid-scipy

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [lint-sync, test, native-sanitizers, build-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          LINT_RESULT: ${{ needs.lint-sync.result }}
          TEST_RESULT: ${{ needs.test.result }}
          NATIVE_RESULT: ${{ needs.native-sanitizers.result }}
          DIST_RESULT: ${{ needs.build-dist.result }}
        shell: bash
        run: |
          if [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success &&
                "$NATIVE_RESULT" == success && "$DIST_RESULT" == success ]]; then
            echo "All required validations succeeded."
          else
            echo "Required results: lint=$LINT_RESULT test=$TEST_RESULT native=$NATIVE_RESULT dist=$DIST_RESULT"
            exit 1
          fi
