# Every qualification uses the reviewed head and retains the full evidence tree.
# Source approval must already exist; these workflows cannot issue source approval.
name: CI
'on':
  push:
    branches:
      - dev
      - main
      - issue88-native-qualification
  pull_request:
    branches:
      - dev
      - main
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
jobs:

  classify:
    runs-on: ubuntu-24.04
    outputs:
      requirements: ${{ steps.route.outputs.requirements }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Classify complete PR diff or full integration push
        id: route
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            python tools/ci_classify_changes.py \
              --pr-base "$PR_BASE" --pr-head "$PR_HEAD"
          else
            python tools/ci_classify_changes.py --full
          fi

  lint-sync:
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 nbformat
      - name: Lint
        run: flake8 src tests tools benchmarks examples
      - name: Check notebook exports
        run: python tools/export_notebooks.py --check
      - name: Check README sync
        run: python tools/gen_readme.py --check

  # Reuse a wheel that completed the full numerical gate in this exact run.
  # Docs-only changes qualify their own artifact when neither Linux job runs.
  docs-and-notebooks:
    needs:
      - classify
      - test-linux-qualified
      - test-linux-runtime
    if: always() && !cancelled() && contains(fromJSON(needs.classify.outputs.requirements), 'docs-and-notebooks') && (needs.test-linux-qualified.result
      == 'success' || needs.test-linux-qualified.result == 'skipped') && (needs.test-linux-runtime.result == 'success' ||
      needs.test-linux-runtime.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.test-linux-runtime.result == 'success' && '3.13' || '3.11' }}
      - name: Reuse qualified Linux wheel
        if: needs.test-linux-qualified.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: qualified-linux-py3.11
          path: ${{ runner.temp }}/docs-wheel
      - name: Reuse qualified Linux wheel
        if: needs.test-linux-runtime.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: qualified-runtime-py3.13
          path: ${{ runner.temp }}/docs-wheel
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy numpy
        if: needs.test-linux-qualified.result == 'skipped' && needs.test-linux-runtime.result == 'skipped'
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          full
        if: needs.test-linux-qualified.result == 'skipped' && needs.test-linux-runtime.result == 'skipped'
      - name: Collect documentation-only qualified wheel
        shell: bash
        if: needs.test-linux-qualified.result == 'skipped' && needs.test-linux-runtime.result == 'skipped'
        run: |
          mkdir -p "${{ runner.temp }}/docs-wheel"
          cp "${{ runner.temp }}/qualification/final-wheel/"*.whl "${{ runner.temp }}/docs-wheel/"
      - name: Install qualified wheel and full optional stack
        shell: bash
        run: |
          shopt -s nullglob
          wheels=("${{ runner.temp }}/docs-wheel/"*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[all]"
      - name: Require the installed qualified planar profile
        run: python tools/check_installed_package.py --require-scipy
      - name: Validate notebooks
        run: python tools/check_notebooks.py
      - name: Test developer tooling
        run: pytest -q tests/tooling
      - name: Check generated files
        run: |
          python tools/export_notebooks.py --check
          python tools/gen_readme.py --check
      - name: Build docs
        run: mkdocs build --strict
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-docs-qualification
          path: ${{ runner.temp }}/qualification
          include-hidden-files: true
        if: always() && needs.test-linux-qualified.result == 'skipped' && needs.test-linux-runtime.result == 'skipped'

  native-sanitizers:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'native-sanitizers')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy numpy
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          adapter --sanitizers
      - name: Install qualified artifact
        shell: bash
        run: python -m pip install "${{ runner.temp }}/qualification/sanitizer-wheel/"*.whl
      - name: Run native safety regressions under ASan and UBSan
        shell: bash
        run: |
          ASAN_LIB="$(g++-13 -print-file-name=libasan.so)"
          UBSAN_LIB="$(g++-13 -print-file-name=libubsan.so)"
          STDCXX_LIB="$(g++-13 -print-file-name=libstdc++.so)"
          test -f "$ASAN_LIB"
          test -f "$UBSAN_LIB"
          test -f "$STDCXX_LIB"
          env \
            LD_PRELOAD="${ASAN_LIB}:${UBSAN_LIB}:${STDCXX_LIB}" \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            PYVORO2_NATIVE_TEST_SANITIZERS=1 \
            python -m pytest -q -s \
              tests/forward/common/test_native_boundary_validation.py \
              tests/forward/common/test_native_preconditions.py \
              tests/forward/common/test_native_runtime_entry.py \
              tests/forward/common/test_native_coercion_state.py \
              tests/forward/common/test_native_route_admission.py \
              tests/forward/common/test_generator_preparation.py \
              tests/forward/spatial/test_duplicate_check.py \
              tests/forward/spatial/test_ghost_cells.py \
              tests/forward/spatial/test_native_witness.py \
              tests/forward/spatial/test_wp7_native_selected.py \
              tests/tooling/test_native_witness_cpp.py \
              tests/forward/planar/test_api_dispatch.py \
              tests/forward/planar/test_wp6_native.py \
              tests/forward/planar/test_wp6_profile_refusal.py \
              tests/forward/planar/test_wp7_native.py \
              tests/forward/test_wp7_oracle.py \
            | tee "${{ runner.temp }}/sanitizer-tests.log"
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-sanitizer-qualification
          path: |
            ${{ runner.temp }}/qualification
            ${{ runner.temp }}/sanitizer-tests.log
          include-hidden-files: true
        if: always()

  # This hardware-capable strict control does not change distribution ISA.
  native-avx-fma:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'native-avx-fma')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CXXFLAGS: -mavx -mfma
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require AVX and FMA capable hardware
        shell: bash
        run: |
          lscpu > "${{ runner.temp }}/avx-fma-cpu.txt"
          python - <<'PYCPU'
          from pathlib import Path
          flags = next(line.split(':', 1)[1].split()
                       for line in Path('/proc/cpuinfo').read_text().splitlines()
                       if line.startswith('flags'))
          assert {'avx', 'fma'} <= set(flags), 'strict control requires AVX/FMA hardware'
          PYCPU
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy numpy
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          full
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-avx-fma-qualification
          path: |
            ${{ runner.temp }}/qualification
            ${{ runner.temp }}/avx-fma-cpu.txt
          include-hidden-files: true
        if: always()

  # The driver performs source/build checks, route corpora and the full suite
  # against the final installed production wheel for every Python version.
  test-linux-qualified:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'test-linux-qualified')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy "numpy<2; python_version<'3.11'" "numpy<3; python_version>='3.11'" "tomli; python_version<'3.11'"
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          full
      - name: Upload qualified wheel
        uses: actions/upload-artifact@v6
        with:
          name: qualified-linux-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/qualification/final-wheel/*.whl
          if-no-files-found: error
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-linux-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/qualification
          include-hidden-files: true
        if: always()

  test-linux-runtime:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'test-linux-runtime')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy numpy
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          full
      - name: Upload qualified wheel
        uses: actions/upload-artifact@v6
        with:
          name: qualified-runtime-py3.13
          path: ${{ runner.temp }}/qualification/final-wheel/*.whl
          if-no-files-found: error
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-linux-runtime
          path: ${{ runner.temp }}/qualification
          include-hidden-files: true
        if: always()

  test-linux-compat:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'test-linux-compat')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.14'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy "numpy<2; python_version<'3.11'" "numpy<3; python_version>='3.11'" "tomli; python_version<'3.11'"
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          adapter
      - name: Install qualified artifact
        shell: bash
        run: python -m pip install "${{ runner.temp }}/qualification/final-wheel/"*.whl
      - name: Exercise Python compatibility without seeded fuzz
        run: python -m pytest -q tests/forward/common/test_internal_validation.py tests/forward/common/test_periodic_images.py
          tests/inverse/separator/test_constraints.py tests/inverse/separator/test_fit.py tests/inverse/separator/test_objective_contract.py
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-linux-compat-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/qualification
          include-hidden-files: true
        if: always()

  # AppleClang and MSVC retain WP5/WP8 positives and explicit WP6/WP7 refusal.
  test-other-platforms:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'test-other-platforms')
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve reviewed source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy "numpy<2; python_version<'3.11'" "numpy<3; python_version>='3.11'" "tomli; python_version<'3.11'"
      - name: Qualify final installed production artifact
        run: python tools/native/qualification/build.py --output "${{ runner.temp }}/qualification" --repair none --suite
          adapter
      - name: Install qualified artifact
        shell: bash
        run: python -m pip install "${{ runner.temp }}/qualification/final-wheel/"*.whl
      - name: Run ordinary spatial, geometry-only, tooling and refusal tests
        run: python -m pytest -q tests/forward/spatial --ignore=tests/forward/spatial/test_ghost_cells.py --ignore=tests/forward/spatial/test_wp7_spatial_certificate.py
          -k "not ghost_reflection_transport" tests/forward/planar/test_wp6_ideal.py tests/forward/planar/test_wp6_consumers.py
          tests/forward/planar/test_wp6_profile_refusal.py tests/forward/common/test_internal_validation.py tests/forward/common/test_exact_lattice_reduction.py
          tests/forward/common/test_periodic_images.py tests/forward/common/test_native_translation.py tests/inverse/separator/test_constraints.py
          tests/inverse/separator/test_fit.py tests/inverse/separator/test_objective_contract.py tests/inverse/separator/test_numerics.py
          tests/tooling > "${{ runner.temp }}/adapter-tests.log" 2>&1
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-adapter-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/qualification
            ${{ runner.temp }}/adapter-tests.log
          include-hidden-files: true
        if: always()

  build-dist:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'build-dist')
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install controlled build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cmake ninja "scikit-build-core>=0.11.4" "pybind11>=3,<4" pytest scipy numpy twine
      - name: Build sdist
        run: python -m build --sdist --outdir "${{ runner.temp }}/sdist-dist"
      - name: Qualify wheel from the actual extracted sdist
        shell: bash
        run: |
          shopt -s nullglob
          sdists=("${{ runner.temp }}/sdist-dist/"*.tar.gz)
          test "${#sdists[@]}" -eq 1
          mkdir "${{ runner.temp }}/sdist-source"
          tar -xf "${sdists[0]}" -C "${{ runner.temp }}/sdist-source"
          sources=("${{ runner.temp }}/sdist-source/"*)
          test "${#sources[@]}" -eq 1
          sdist_source="${sources[0]}"
          python "$sdist_source/tools/native/qualification/build.py" \
            --source-root "$sdist_source" \
            --output "${{ runner.temp }}/qualification" --repair none --suite full
          cp "${{ runner.temp }}/qualification/final-wheel/"*.whl "${{ runner.temp }}/sdist-dist/"
      - name: Validate finalized distribution metadata and contents
        run: |
          python tools/check_dist_metadata.py "${{ runner.temp }}/sdist-dist"
          python tools/check_dist.py --require-qualification "${{ runner.temp }}/sdist-dist"
      - name: Create fresh no-SciPy environment and install rebuilt wheel
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/pyvoro2-sdist-venv"
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" -m pip install "${{ runner.temp }}/sdist-dist/"*.whl
      - name: Check no-SciPy installation and positive certificate routes
        run: |
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" -m pip check
          "${{ runner.temp }}/pyvoro2-sdist-venv/bin/python" tools/check_installed_package.py --forbid-scipy
      - name: Preserve complete build and qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: native-sdist-qualification
          path: |
            ${{ runner.temp }}/qualification
            ${{ runner.temp }}/sdist-source
            ${{ runner.temp }}/sdist-dist
          include-hidden-files: true
        if: always()

  wheels:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.requirements), 'wheels')
    uses: ./.github/workflows/wheels.yml

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - classify
      - lint-sync
      - docs-and-notebooks
      - native-sanitizers
      - native-avx-fma
      - test-linux-qualified
      - test-linux-runtime
      - test-linux-compat
      - test-other-platforms
      - build-dist
      - wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check required job conclusions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/ci_classify_changes.py --check-gate
