site_name: pyvoro2
site_dir: site
site_description: Scientific Python tools for forward and inverse 2D/3D Voronoi and power/Laguerre tessellations, periodic topology, and separator fitting.
site_url: https://delonecommons.github.io/pyvoro2/
repo_url: https://github.com/DeloneCommons/pyvoro2
repo_name: DeloneCommons/pyvoro2
edit_uri: edit/main/docs/

theme:
  name: material
  variant: classic
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            heading_level: 2
markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css

